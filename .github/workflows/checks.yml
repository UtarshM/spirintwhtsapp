name: Application checks
on: [push, pull_request]
jobs:
  application:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Build persistent voice container
        run: docker build -f services/voice/Dockerfile -t sprint-voice:check .
  voice_infrastructure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.13.3
      - run: terraform -chdir=infra/voice fmt -check
      - run: terraform -chdir=infra/voice init -backend=false -input=false
      - run: terraform -chdir=infra/voice validate
  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: local-ci-only
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: local-ci-only
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Install database test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client python3
      - name: Apply migrations and verify tenant/provider invariants
        run: |
          psql -v ON_ERROR_STOP=1 -f tests/database-bootstrap.sql
          for migration in supabase/migrations/*.sql; do
            psql -v ON_ERROR_STOP=1 -f "$migration"
          done
          psql -v ON_ERROR_STOP=1 -f tests/database.test.sql
          psql -v ON_ERROR_STOP=1 -f tests/workspace-draft.database.sql
          psql -v ON_ERROR_STOP=1 -f tests/meta-events.database.sql
          psql -v ON_ERROR_STOP=1 -f tests/voice.database.sql
          python3 tests/database-concurrency.py --host 127.0.0.1 --port 5432
          python3 tests/workspace-draft-concurrency.py --host 127.0.0.1 --port 5432
          python3 tests/meta-events-concurrency.py --host 127.0.0.1 --port 5432
          python3 tests/voice-concurrency.py --host 127.0.0.1 --port 5432
